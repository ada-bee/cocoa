services:
  cocoa-gateway:
    image: ${COCOA_GATEWAY_IMAGE_REFERENCE:?Set COCOA_GATEWAY_IMAGE_REFERENCE to a local sha256 image ID or published repository digest}
    pull_policy: never
    platform: linux/arm64
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    ports:
      - "7331:7331"
    environment:
      T3CODE_RUNTIME_PROFILE: cocoa-gateway
      T3CODE_HOST: 0.0.0.0
      T3CODE_PORT: "7331"
      T3CODE_HOME: /data
      T3CODE_AUTO_BOOTSTRAP_PROJECT_FROM_CWD: "false"
      T3CODE_NO_BROWSER: "true"
    volumes:
      - cocoa-data:/data
    secrets:
      - source: codex-macaroni-signed-bearer
        target: /run/secrets/codex_macaroni_ws_shared_secret
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: codex-rigatoni-signed-bearer
        target: /run/secrets/codex_rigatoni_ws_shared_secret
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: codex-rigatoni-alfredo-signed-bearer
        target: /run/secrets/codex_rigatoni_alfredo_ws_shared_secret
        uid: "10001"
        gid: "10001"
        mode: 0400
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
      - /data/userdata/logs:rw,nosuid,nodev,noexec,size=128m,mode=0750,uid=10001,gid=10001
      - /data/worktrees:rw,nosuid,nodev,noexec,size=16m,mode=0750,uid=10001,gid=10001
      - /data/caches:rw,nosuid,nodev,noexec,size=32m,mode=0750,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r=await fetch('http://127.0.0.1:7331/readyz');if(!r.ok)process.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cocoa-data:

secrets:
  codex-macaroni-signed-bearer:
    file: ./secrets/codex_macaroni_ws_shared_secret
  codex-rigatoni-signed-bearer:
    file: ./secrets/codex_rigatoni_ws_shared_secret
  codex-rigatoni-alfredo-signed-bearer:
    file: ./secrets/codex_rigatoni_alfredo_ws_shared_secret
