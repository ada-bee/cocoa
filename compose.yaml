services:
  cocoa:
    image: ghcr.io/ada-bee/cocoa:${COCOA_VERSION:-latest}
    pull_policy: always
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    ports:
      - "7331:7331"
    volumes:
      - cocoa-data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
      - /data/userdata/logs:rw,nosuid,nodev,noexec,size=128m,mode=0750,uid=10001,gid=10001
      - /data/worktrees:rw,nosuid,nodev,noexec,size=16m,mode=0750,uid=10001,gid=10001
      - /data/caches:rw,nosuid,nodev,noexec,size=32m,mode=0750,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  cocoa-data:
