name: Upstream intake

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-intake
  cancel-in-progress: true

jobs:
  forecast:
    name: Check for unreviewed upstream commits
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Cocoa history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --tags upstream main

      - name: Forecast upstream intake
        run: bun scripts/cocoa-upstream-forecast.ts
